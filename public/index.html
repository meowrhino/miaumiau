<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>miaumiau</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="icon" href="/favicon/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Unread badge (floating, no header) -->
  <button id="headerUnread" class="unread-badge" hidden onclick="App.go('chat')">0</button>

  <!-- Registration (shown if no user) -->
  <section id="registration" class="mode" hidden>
    <div class="reg-container">
      <div class="reg-hero">
        <div id="regAvatarPreview" class="reg-avatar"></div>
        <div id="regAvatarGlow" class="reg-avatar-glow"></div>
      </div>
      <div class="reg-form">
        <h1 class="reg-title">miau<span class="reg-title-accent">miau</span></h1>
        <p class="reg-subtitle">tu espacio libre, sin anuncios, sin algoritmos</p>
        <input id="regName" type="text" placeholder="elige tu nombre" maxlength="25" autocomplete="off"
               oninput="App.updateRegPreview()">
        <p class="reg-label">color de tu gato</p>
        <div id="regColorGrid" class="color-grid"></div>
        <button id="regReroll" class="btn small" onclick="App.rerollAvatar()" title="otro gato">otro gato</button>
        <button id="regSubmit" class="btn primary big" onclick="App.register()">entrar al mundo miau</button>
        <p id="regError" class="error" hidden></p>
        <button class="btn-link" onclick="App.showLogin()">ya tengo cuenta</button>
      </div>
    </div>
  </section>

  <!-- Login (recover from another device) -->
  <section id="login" class="mode" hidden>
    <div class="card center">
      <h2>reconectar</h2>
      <input id="loginKey" type="text" placeholder="usuario#clave" autocomplete="off">
      <button class="btn primary" onclick="App.login()">entrar</button>
      <button class="btn" onclick="App.showRegistration()">crear cuenta nueva</button>
      <p id="loginError" class="error" hidden></p>
    </div>
  </section>

  <!-- Mode: Stories -->
  <section id="mode-stories" class="mode" hidden>
    <div id="storyBubbles" class="story-bubbles"></div>
    <button class="fab" onclick="App.openStoryEditor()">+</button>
  </section>

  <!-- Mode: Posts -->
  <section id="mode-posts" class="mode" hidden>
    <div id="postFeed" class="feed"></div>
    <button id="postsMore" class="btn load-more" hidden onclick="App.loadPosts(++App.postsPage)">cargar m&aacute;s</button>
    <button class="fab" onclick="App.openPostComposer()">+</button>
  </section>

  <!-- Mode: Tweets -->
  <section id="mode-tweets" class="mode" hidden>
    <div class="feed">
      <div id="tweetComposer" class="tweet-composer">
        <img id="composerAvatar" class="avatar" src="">
        <div class="tweet-composer-body">
          <textarea id="tweetInput" placeholder="que pasa miau?" maxlength="1000" rows="1"
                    oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
          <div class="composer-bar">
            <span id="tweetCount" class="char-count">0/1000</span>
            <button class="btn primary small" onclick="App.createTweet()">miau</button>
          </div>
        </div>
      </div>
      <div id="tweetTimeline"></div>
      <button id="tweetsMore" class="btn load-more" hidden onclick="App.loadTweets(++App.tweetsPage)">m&aacute;s</button>
    </div>
  </section>

  <!-- Mode: Chat -->
  <section id="mode-chat" class="mode" hidden>
    <div id="chatConversations" class="feed"></div>
    <div id="chatThread" class="chat-thread" hidden>
      <div id="chatHeader" class="chat-header">
        <button class="btn small" onclick="App.closeChat()">&larr;</button>
        <span id="chatWith"></span>
      </div>
      <div id="chatMessages" class="chat-messages"></div>
      <div class="composer">
        <input id="chatInput" type="text" placeholder="escribe..." maxlength="2000"
               onkeydown="if(event.key==='Enter')App.sendMessage()">
        <button class="btn primary small" onclick="App.sendMessage()">enviar</button>
      </div>
    </div>
  </section>

  <!-- Mode: Profile (5th tab) -->
  <section id="mode-profile" class="mode" hidden>
    <div class="profile-page">
      <div class="profile-avatar-area">
        <div id="profileAvatar" class="profile-avatar-big"></div>
        <button class="btn small" onclick="App.rerollProfileAvatar()">otro gato</button>
      </div>

      <div class="profile-section">
        <h2>tu gato</h2>
        <p class="profile-label">color</p>
        <div id="profileColorGrid" class="color-grid"></div>
      </div>

      <div class="profile-section">
        <h2>perfil</h2>
        <p class="profile-label">nombre</p>
        <p id="profileName" class="profile-value"></p>
        <p class="profile-label">bio</p>
        <textarea id="profileBio" maxlength="200" rows="2" placeholder="algo sobre ti..."></textarea>
        <button class="btn primary" onclick="App.saveProfile()">guardar</button>
      </div>

      <div class="profile-section">
        <h2>tu clave secreta</h2>
        <p class="muted" style="font-size:0.75rem;margin-bottom:6px">guardala bien, sin ella no puedes reconectar</p>
        <div class="profile-key">
          <code id="profileKey"></code>
          <button class="btn small" onclick="App.copyKey()">copiar</button>
        </div>
      </div>

      <div class="profile-section">
        <h2>tema</h2>
        <div class="profile-theme-row">
          <button class="btn" onclick="App.setTheme('light')" id="btnLight">claro</button>
          <button class="btn" onclick="App.setTheme('dark')" id="btnDark">oscuro</button>
        </div>
      </div>

      <div class="profile-section">
        <button class="btn danger" onclick="App.deleteAccount()">eliminar cuenta</button>
      </div>
    </div>
  </section>

  <!-- Reply Modal -->
  <div id="replyModal" class="modal" hidden>
    <div class="modal-content card">
      <div id="replyThread"></div>
      <textarea id="replyInput" placeholder="responder..." maxlength="1000" rows="2"></textarea>
      <div class="modal-actions">
        <button class="btn" onclick="App.closeReply()">cerrar</button>
        <button class="btn primary" onclick="App.submitReply()">responder</button>
      </div>
    </div>
  </div>

  <!-- Post Composer Modal -->
  <div id="postModal" class="modal" hidden>
    <div class="modal-content card">
      <h2>nueva publicaci&oacute;n</h2>
      <input id="postFile" type="file" accept="image/*">
      <img id="postPreview" class="post-preview" hidden>
      <span id="postSize" class="muted"></span>
      <textarea id="postCaption" placeholder="escribe algo..." maxlength="500" rows="2"></textarea>
      <div class="modal-actions">
        <button class="btn" onclick="App.closePostComposer()">cerrar</button>
        <button class="btn primary" onclick="App.submitPost()">publicar</button>
      </div>
    </div>
  </div>

  <!-- Story Viewer -->
  <div id="storyViewer" class="story-viewer" hidden>
    <div id="storyProgress" class="story-progress"></div>
    <img id="storyImage" class="story-image">
    <div id="storyLayers" class="story-layers"></div>
    <div class="story-nav">
      <div class="story-nav-left" onclick="App.storyPrev()"></div>
      <div class="story-nav-right" onclick="App.storyNext()"></div>
    </div>
    <button class="story-close" onclick="App.closeStoryViewer()">&times;</button>
  </div>

  <!-- Story Editor Modal -->
  <div id="storyEditor" class="story-editor" hidden>
    <div class="story-editor-toolbar">
      <button class="btn small active" data-tool="draw" onclick="StoryEditor.setTool('draw')">dibujar</button>
      <button class="btn small" data-tool="text" onclick="StoryEditor.setTool('text')">texto</button>
      <button class="btn small" data-tool="link" onclick="StoryEditor.setTool('link')">link</button>
      <input id="storyDrawColor" type="color" value="#ffffff" onchange="StoryEditor.drawColor=this.value">
      <select id="storyDrawSize" onchange="StoryEditor.drawSize=+this.value">
        <option value="2">fino</option>
        <option value="4" selected>normal</option>
        <option value="8">grueso</option>
        <option value="16">mega</option>
      </select>
      <button class="btn small" onclick="StoryEditor.toggleEraser()">borrador</button>
    </div>
    <div id="storyEditorCanvas" class="story-editor-canvas">
      <img id="storyEditorBg">
      <canvas id="storyEditorDraw"></canvas>
      <div id="storyEditorOverlays"></div>
    </div>
    <div class="story-editor-actions">
      <input id="storyFile" type="file" accept="image/*" onchange="StoryEditor.loadImage(this.files[0])">
      <button class="btn" onclick="StoryEditor.close()">cancelar</button>
      <button class="btn primary" onclick="StoryEditor.publish()">publicar</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- Bottom Nav -->
  <nav id="bottomNav">
    <button data-mode="stories" onclick="App.go('stories')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="nav-label">stories</span>
    </button>
    <button data-mode="posts" onclick="App.go('posts')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span class="nav-label">posts</span>
    </button>
    <button data-mode="tweets" onclick="App.go('tweets')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H8l-4 4V6c0-1.1.9-2 2-2z"/></svg>
      <span class="nav-label">miau</span>
    </button>
    <button data-mode="chat" onclick="App.go('chat')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="nav-label">chat</span>
    </button>
    <button data-mode="profile" onclick="App.go('profile')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2z"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/><path d="M7 3.5L9 6M17 3.5L15 6"/></svg>
      <span class="nav-label">tu gato</span>
    </button>
  </nav>

  <!-- Scripts -->
  <script src="/js/colors.js"></script>
  <script src="/js/avatar.js"></script>
  <script src="/js/themes.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/media.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/mode.tweets.js"></script>
  <script src="/js/mode.posts.js"></script>
  <script src="/js/mode.stories.js"></script>
  <script src="/js/mode.chat.js"></script>
  <script src="/js/mode.profile.js"></script>
  <script src="/js/story-editor.js"></script>
</body>
</html>
